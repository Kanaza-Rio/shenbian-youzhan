<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="description" content="身边有展 · 不错过身边触手可及、未经宣传的展会和活动" />
  <title>身边有展 · 不错过身边的活动</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">展</div>
        <div class="brand-text">
          <h1>身边有展</h1>
          <p>不错过身边的活动</p>
        </div>
      </div>
      <button class="city-btn" id="cityBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="cityLabel">上海</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </header>

    <!-- 首次偏好引导横幅 -->
    <div class="onboard" id="onboard">
      <div class="onboard-inner">
        <p class="onboard-title">先告诉我们你感兴趣什么，推送更懂你</p>
        <button class="onboard-cta" id="onboardCta" type="button">设置偏好</button>
      </div>
    </div>

    <!-- 视图容器 -->
    <main class="main">

      <!-- 视图：推荐信息流 -->
      <section class="view" id="view-feed">
        <div class="date-strip" id="dateStrip"></div>
        <div class="feed" id="feed"></div>
      </section>

      <!-- 视图：日历 -->
      <section class="view hidden" id="view-calendar">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev" type="button" aria-label="上个月">‹</button>
          <h2 class="cal-title" id="calTitle">2026年8月</h2>
          <button class="cal-nav" id="calNext" type="button" aria-label="下个月">›</button>
        </div>
        <div class="cal-week">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-detail" id="calDetail"></div>
      </section>

      <!-- 视图：偏好设置 -->
      <section class="view hidden" id="view-prefs">
        <h2 class="prefs-h2">兴趣偏好</h2>
        <p class="prefs-desc">选择你感兴趣的类型，同类活动会优先推送。可随时修改。</p>
        <div class="chip-wrap" id="prefChips"></div>
        <h2 class="prefs-h2">我的城市</h2>
        <p class="prefs-desc">同城活动优先，邻城次之，更远的排后面。</p>
        <div class="city-grid" id="prefCityGrid"></div>
        <button class="save-btn" id="savePrefs" type="button">保存偏好</button>
        <div class="prefs-note">数据为演示样例，活动时间地点请以官方发布为准。</div>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-view="feed" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <span>发现</span>
      </button>
      <button class="tab" data-view="calendar" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>日历</span>
      </button>
      <button class="tab" data-view="prefs" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span>偏好</span>
      </button>
    </nav>

  </div>

  <!-- 活动详情底部抽屉 -->
  <div class="sheet-mask hidden" id="sheetMask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="活动详情">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>

  <!-- 城市选择弹窗 -->
  <div class="modal-mask hidden" id="cityMask"></div>
  <div class="modal" id="cityModal" role="dialog" aria-label="选择城市">
    <h3>选择城市</h3>
    <p class="modal-desc">同城活动优先推送，邻城次之</p>
    <div class="city-list" id="cityList"></div>
    <button class="modal-close" id="cityClose" type="button">完成</button>
  </div>

  <!-- 偏好设置弹窗（首次引导用） -->
  <div class="modal-mask hidden" id="prefMask"></div>
  <div class="modal" id="prefModal" role="dialog" aria-label="设置偏好">
    <h3>设置兴趣偏好</h3>
    <p class="modal-desc">选择感兴趣的类别，我们会优先推送同类活动</p>
    <div class="chip-wrap" id="prefModalChips"></div>
    <button class="modal-close" id="prefModalClose" type="button">保存并开始</button>
  </div>

  <script src="data/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
